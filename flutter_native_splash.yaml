# Flutter Native Splash Configuration
# Custom Google-style splash screen with centered logo

flutter_native_splash:
  # Base background color
  color: "#FFFFFF"
  color_dark: "#1E1E1E"
  
  # Centered logo
  image: Re_splash.png
  image_dark: Re_splash.png

  # Android 12+ specific settings
  android_12:
    color: "#FFFFFF"
    color_dark: "#1E1E1E"
    image: Re_splash.png
    image_dark: Re_splash.png

  # Platform specific settings
  android: true
  ios: true
  web: false
  
  # Fullscreen for immersive experience
  fullscreen: true
