org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.nonFinalResIds=true
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false

# Kotlin incremental compilation disabled for cross-machine compatibility
# Can be set to true for faster local builds if pub cache and project are on the same drive
kotlin.incremental=false

# 16 KB page size support for Android 15+ devices
android.enablePageSizeConfig=true

flutter.versionName=1.0.0
flutter.versionCode=1
flutter.minSdkVersion=26
flutter.targetSdkVersion=36
flutter.compileSdkVersion=36

# Explicitly define supported architectures - arm64-v8a only for 16KB page size support
android.abiFilters=arm64-v8a

# 16 KB page size support
android.bundle.enableUncompressedNativeLibs=true

