org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=true
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false

# Disable x86 architecture to fix Flutter build issues
flutter.buildMode=debug
flutter.versionName=1.0.0
flutter.versionCode=1
flutter.minSdkVersion=21
flutter.targetSdkVersion=33
flutter.compileSdkVersion=33

# Explicitly define supported architectures
android.abiFilters=arm64-v8a,armeabi-v7a

### ReBoard-specific flags ###
projectMinSdk=26
projectTargetSdk=36
projectCompileSdk=36
projectVersionCode=114
projectVersionName=0.5.0-rc02

# Suppress compile SDK 36 warning with AGP 8.7.0
android.suppressUnsupportedCompileSdk=36
