org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.nonFinalResIds=true
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false

# Kotlin incremental compilation disabled for cross-machine compatibility.
kotlin.incremental=false
ksp.incremental=false

# 16 KB page size support for Android 15+ devices
android.enablePageSizeConfig=true

# R8 Optimization flags for Google Play Performance & Shrinking
android.enableR8.fullMode=true

### ReBoard-specific flags ###
projectMinSdk=26
projectTargetSdk=36
projectCompileSdk=37
projectVersionCode=125
projectVersionName=3.2.0
# Keep the external Kotlin Gradle plugins enabled during the AGP 9 migration.
android.builtInKotlin=false
# Retain the legacy Android DSL until the keyboard library scripts are migrated.
android.newDsl=false
# Release switches, read by ReleaseFlags in the keyboard module (app and keyboard both see them).
# Free release: no sign-in needed and no subscriptions sold. Flip both to true to bring them back.
rewordium.requireSignIn=false
rewordium.subscriptionsEnabled=false
