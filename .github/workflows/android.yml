name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Same Flutter as local release builds, so CI output matches.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Prepare config
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          mkdir -p assets/config
          touch assets/config/.gitkeep

          # The Android Firebase key ships inside every APK and is already in
          # google-services.json; a FIREBASE_API_KEY secret only overrides it.
          if [ -z "${FIREBASE_API_KEY}" ]; then
            FIREBASE_API_KEY=$(jq -r '.client[0].api_key[0].current_key' android/app/google-services.json)
          fi

          # .env is a Flutter asset (read at runtime) and a Gradle key source.
          {
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "KLIPY_API_KEY=${KLIPY_API_KEY}"
            echo "FIREBASE_API_KEY=${FIREBASE_API_KEY}"
          } > .env

          [ -n "${GROQ_API_KEY}" ] || echo "::warning::GROQ_API_KEY secret is not set: AI features are disabled in this build."
          [ -n "${KLIPY_API_KEY}" ] || echo "::warning::KLIPY_API_KEY secret is not set: the GIF panel is disabled in this build."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; release builds must be signed with the upload key."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/app/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          FLUTTER_NO_DAEMON: true
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewordium-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
