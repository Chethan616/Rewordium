name: iOS Sideloadly Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        # This builds the unsigned .app payload
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for Sideloadly
        # Sideloadly expects an IPA, which is just a zipped 'Payload' folder containing the .app
        # This completely bypasses Xcode's strict provisioning profile requirements for exporting!
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r -q rewordium-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rewordium-ios-sideloadly
          path: rewordium-unsigned.ipa
