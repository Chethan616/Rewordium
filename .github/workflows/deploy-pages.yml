name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches:
      - main
      - playstore
    paths:
      - 'website2.0/rewordium-landingpage/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Firebase Configuration & Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyBoG1w3GaQVy2O6kjp-ZQw09TZgbUWjrTg' }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:1046215732414:web:rewordium_web_app' }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '1046215732414' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'rewordium' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'rewordium.firebaseapp.com' }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'rewordium.firebasestorage.app' }}
        run: |
          sed -i "s/__FIREBASE_API_KEY__/${FIREBASE_API_KEY}/g" website2.0/rewordium-landingpage/pages/delete-account.html
          sed -i "s/__FIREBASE_APP_ID__/${FIREBASE_APP_ID}/g" website2.0/rewordium-landingpage/pages/delete-account.html
          sed -i "s/__FIREBASE_MESSAGING_SENDER_ID__/${FIREBASE_MESSAGING_SENDER_ID}/g" website2.0/rewordium-landingpage/pages/delete-account.html
          sed -i "s/__FIREBASE_PROJECT_ID__/${FIREBASE_PROJECT_ID}/g" website2.0/rewordium-landingpage/pages/delete-account.html
          sed -i "s/__FIREBASE_AUTH_DOMAIN__/${FIREBASE_AUTH_DOMAIN}/g" website2.0/rewordium-landingpage/pages/delete-account.html
          sed -i "s/__FIREBASE_STORAGE_BUCKET__/${FIREBASE_STORAGE_BUCKET}/g" website2.0/rewordium-landingpage/pages/delete-account.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website2.0/rewordium-landingpage'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
