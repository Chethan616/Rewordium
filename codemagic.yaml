workflows:
  ios_sideloadly:
    name: iOS Sideloadly Build
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      flutter: stable
      # Xcode 26.5 (Swift 6.3, iOS 26 SDK):
      #  • KeyboardKit 10.5+ binary compiled with Swift 6.2.4 — needs ≥6.2 compiler
      #  • Xcode 26.4 only has Swift 6.1.2 → "SDK not supported by the compiler"
      #  • Liquid Glass / FoundationModels APIs require iOS 26 SDK
      xcode: 26.5
      cocoapods: default

      vars:
        BUNDLE_ID: com.noxquill.rewordium
        KEYBOARD_BUNDLE_ID: com.noxquill.rewordium.keyboard
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

      groups:
        - ios_secrets

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - name: Install dependencies
        script: |
          # Flutter's SPM integration rsyncs plugin sources into these dirs
          # during pub get — they must exist on a fresh checkout.
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages
          flutter pub get

      - name: Prepare .env for CI
        script: |
          cat > .env <<EOF
          GROQ_API_KEY=$GROQ_API_KEY
          EOF

      - name: Restore Firebase iOS config
        script: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          gs = os.environ.get("IOS_GOOGLESERVICE_INFO_PLIST_BASE64", "")
          if not gs:
              sys.stderr.write("Missing IOS_GOOGLESERVICE_INFO_PLIST_BASE64\n")
              sys.exit(1)

          pathlib.Path("ios/Runner").mkdir(parents=True, exist_ok=True)
          with open("ios/Runner/GoogleService-Info.plist", "wb") as f:
              f.write(base64.b64decode(gs))

          app_id = os.environ.get("IOS_FIREBASE_APP_ID_FILE_BASE64", "")
          if app_id:
              pathlib.Path("ios").mkdir(parents=True, exist_ok=True)
              with open("ios/firebase_app_id_file.json", "wb") as f:
                  f.write(base64.b64decode(app_id))
          PY

      - name: Set iOS bundle identifier
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" ios/Runner/Info.plist

      - name: Wire RewordiumKeyboard extension target
        script: |
          # Idempotent — adds the keyboard extension target to Runner.xcodeproj.
          # The `xcodeproj` gem ships with the Codemagic mac image (CocoaPods uses it).
          gem list xcodeproj -i >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          cd ios
          ruby scripts/setup_keyboard_target.rb

      - name: Resolve SwiftPM packages
        script: |
          # Pre-fetch KeyboardKit so the cache populates before the build.
          # Idempotent — re-runs hit $HOME/Library/Caches/org.swift.swiftpm.
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages

      - name: Build iOS app (no codesign)
        script: |
          # Two-stage build:
          #  1. `flutter build ios --release --no-codesign` runs to generate
          #     Flutter's iOS scaffolding (Generated.xcconfig, pod install,
          #     Flutter framework). On Xcode 26 / iOS 26 SDK, flutter_tools
          #     added a strict post-build validation that demands
          #     DEVELOPMENT_TEAM be set even when --no-codesign is passed.
          #     The actual xcodebuild *inside* the flutter command succeeds —
          #     only the trailing validation step trips. We tolerate that
          #     failure with `|| echo` because:
          #  2. Our own explicit xcodebuild below re-runs the build into a
          #     directory we control with CODE_SIGNING_ALLOWED=NO etc.
          #     forced at the command line — those override anything in
          #     pbxproj that the post-build validator complained about.
          #
          # Building for device (`-sdk iphoneos`) sidesteps the MLKit
          # arm64-simulator problem entirely — MLKit ships full
          # arm64-iphoneos slices, so OCR works on real iPhones.
          # Liquid Glass / iOS 26 SDK code paths are reachable on any iOS 26
          # device installed via Sideloadly.
          flutter build ios --release --no-codesign \
            --build-name="${FCI_BUILD_NAME:-2.9.1}" \
            --build-number="${CM_BUILD_NUMBER:-75}" \
            || echo "(flutter post-build validation failed — continuing with our own xcodebuild, see codemagic.yaml comment)"

          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            -clonedSourcePackagesDirPath build/ios/SourcePackages \
            -quiet clean build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA for Sideloadly
        script: |
          rm -rf Payload rewordium-unsigned.ipa
          mkdir -p Payload
          mv build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app Payload/
          # The .appex is already nested inside Runner.app/PlugIns/ from the
          # Embed Foundation Extensions phase — nothing else to copy.
          zip -r -q rewordium-unsigned.ipa Payload

    artifacts:
      - rewordium-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
