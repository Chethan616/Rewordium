workflows:
  ios_sideloadly:
    name: iOS Sideloadly Build
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.noxquill.rewordium
        KEYBOARD_BUNDLE_ID: com.noxquill.rewordium.keyboard
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      groups:
        - ios_secrets
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Prepare .env for CI
        script: |
          cat > .env <<EOF
          GROQ_API_KEY=$GROQ_API_KEY
          EOF

      - name: Restore Firebase iOS config
        script: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          gs = os.environ.get("IOS_GOOGLESERVICE_INFO_PLIST_BASE64", "")
          if not gs:
              sys.stderr.write("Missing IOS_GOOGLESERVICE_INFO_PLIST_BASE64\n")
              sys.exit(1)

          pathlib.Path("ios/Runner").mkdir(parents=True, exist_ok=True)
          with open("ios/Runner/GoogleService-Info.plist", "wb") as f:
              f.write(base64.b64decode(gs))

          app_id = os.environ.get("IOS_FIREBASE_APP_ID_FILE_BASE64", "")
          if app_id:
              pathlib.Path("ios").mkdir(parents=True, exist_ok=True)
              with open("ios/firebase_app_id_file.json", "wb") as f:
                  f.write(base64.b64decode(app_id))
          PY

      - name: Set iOS bundle identifier
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" ios/Runner/Info.plist

      - name: Fetch AzooKey dictionary submodules
        script: |
          # AzooKey ships its Japanese + emoji dictionaries as git submodules
          # pointing at separate GitHub repos. We checked in empty placeholder
          # directories; populate them on CI before the keyboard target wires
          # them as resources. Idempotent — re-run is a no-op once cloned.
          set -e
          cd ios/Packages/azooKey

          clone_if_empty() {
            local target_dir="$1"
            local repo_url="$2"
            if [ -d "$target_dir/.git" ] || [ -n "$(ls -A "$target_dir" 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
              echo "  ✓ $target_dir already populated"
              return 0
            fi
            echo "  → cloning $repo_url into $target_dir"
            rm -rf "$target_dir"
            git clone --depth 1 "$repo_url" "$target_dir"
            rm -rf "$target_dir/.git"
          }

          clone_if_empty azooKey_dictionary_storage \
            https://github.com/ensan-hcl/azooKey_dictionary_storage
          clone_if_empty azooKey_emoji_dictionary_storage \
            https://github.com/azooKey/azooKey_emoji_dictionary_storage

          # Zenzai (neural converter) model files live on HuggingFace and are
          # >100 MB each. Phase 2 builds without them — AzooKey degrades to its
          # statistical converter. Re-enable in Phase 5 if Japanese quality
          # complaints come in.
          # clone_if_empty zenz-v3.1-small-gguf  https://huggingface.co/Miwa-Keita/zenz-v3.1-small-gguf
          # clone_if_empty zenz-v3.1-xsmall-gguf https://huggingface.co/Miwa-Keita/zenz-v3.1-xsmall-gguf

      - name: Wire RewordiumKeyboard extension target
        script: |
          # Idempotent — adds the keyboard extension target to Runner.xcodeproj.
          # `xcodeproj` gem ships with the Codemagic mac image (CocoaPods uses it).
          gem list xcodeproj -i >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          cd ios
          ruby scripts/setup_keyboard_target.rb

      - name: Resolve SwiftPM packages
        script: |
          # Pull AzooKeyKanaKanjiConverter + CustardKit before the build proper
          # so the cache key for the Pods step lines up.
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages

      - name: Build iOS app (no codesign)
        script: |
          # flutter build ios generates ios/Podfile (if absent) and runs
          # `pod install`. We commit a Podfile so the deployment target is 17.0.
          flutter build ios --release --no-codesign \
            --build-name="${FCI_BUILD_NAME:-2.9.1}" \
            --build-number="${CM_BUILD_NUMBER:-75}"
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            -clonedSourcePackagesDirPath build/ios/SourcePackages \
            -quiet clean build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA for Sideloadly
        script: |
          rm -rf Payload rewordium-unsigned.ipa
          mkdir -p Payload
          mv build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app Payload/
          # The .appex is already nested inside Runner.app/PlugIns/ from the
          # Embed Foundation Extensions phase — nothing else to copy.
          zip -r -q rewordium-unsigned.ipa Payload

    artifacts:
      - rewordium-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
