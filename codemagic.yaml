workflows:
  ios_sideloadly:
    name: iOS Sideloadly Build
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      flutter: stable
      # Xcode 26.5 (Swift 6.3, iOS 26 SDK):
      #  • KeyboardKit 10.5+ binary compiled with Swift 6.2.4 — needs ≥6.2 compiler
      #  • Xcode 26.4 only has Swift 6.1.2 → "SDK not supported by the compiler"
      #  • Liquid Glass / FoundationModels APIs require iOS 26 SDK
      xcode: 26.5
      cocoapods: default

      vars:
        BUNDLE_ID: com.noxquill.rewordium
        KEYBOARD_BUNDLE_ID: com.noxquill.rewordium.keyboard
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

      groups:
        - ios_secrets

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - name: Install dependencies
        script: |
          # Disable Flutter's plugin Swift Package Manager integration.
          #
          # WHY: with SPM enabled, Flutter auto-adds SPM-capable plugins
          # (firebase_core, firebase_auth, firebase_messaging, cloud_firestore,
          # …) to ios/Flutter/ephemeral/Packages AND the Podfile's
          # `flutter_install_all_ios_pods` ALSO installs them as CocoaPods.
          # Both paths emit the same Objective-C symbols, so the Runner
          # binary fails to link with "25 duplicate symbol" errors (see
          # firebase_core.o vs firebase_core_shared.o in prior CI run).
          #
          # The keyboard extension's KeyboardKit SPM dependency is wired
          # by ios/scripts/setup_keyboard_target.rb (XCSwiftPackageProduct-
          # Dependency on the extension target only), independent of
          # Flutter's plugin-SPM machinery — so this flag does NOT affect
          # KeyboardKit, only the host-app plugin resolution.
          flutter config --no-enable-swift-package-manager

          # Flutter's SPM integration used to rsync plugin sources into
          # these dirs during pub get. Harmless to leave the mkdirs in
          # case future Flutter versions still expect them.
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages

          # Wipe any cached iOS build state from a previous failed run so
          # CocoaPods resolves fresh against the current pubspec, and any
          # ephemeral SPM packages from prior SPM-enabled runs are dropped.
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          # cloud_firestore is pinned to exact 6.1.3 in pubspec.yaml.
          # The lock may still hold a newer entry (6.3.0 / 6.4.1) from
          # prior runs that bumped it. `flutter pub downgrade` refreshes
          # the lock to the lowest version satisfying the constraint —
          # for an exact pin that's 6.1.3.
          flutter pub downgrade cloud_firestore cloud_firestore_platform_interface cloud_firestore_web
          flutter pub get

      - name: Prepare .env for CI
        script: |
          cat > .env <<EOF
          GROQ_API_KEY=$GROQ_API_KEY
          EOF

      - name: Restore Firebase iOS config
        script: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          gs = os.environ.get("IOS_GOOGLESERVICE_INFO_PLIST_BASE64", "")
          if not gs:
              sys.stderr.write("Missing IOS_GOOGLESERVICE_INFO_PLIST_BASE64\n")
              sys.exit(1)

          pathlib.Path("ios/Runner").mkdir(parents=True, exist_ok=True)
          with open("ios/Runner/GoogleService-Info.plist", "wb") as f:
              f.write(base64.b64decode(gs))

          app_id = os.environ.get("IOS_FIREBASE_APP_ID_FILE_BASE64", "")
          if app_id:
              pathlib.Path("ios").mkdir(parents=True, exist_ok=True)
              with open("ios/firebase_app_id_file.json", "wb") as f:
                  f.write(base64.b64decode(app_id))
          PY

      - name: Set iOS bundle identifier
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" ios/Runner/Info.plist

      - name: Wire RewordiumKeyboard extension target
        script: |
          # Idempotent — adds the keyboard extension target to Runner.xcodeproj.
          # The `xcodeproj` gem ships with the Codemagic mac image (CocoaPods uses it).
          gem list xcodeproj -i >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          cd ios
          ruby scripts/setup_keyboard_target.rb

      - name: Resolve SwiftPM packages
        script: |
          # Pre-fetch KeyboardKit so the cache populates before the build.
          # Idempotent — re-runs hit $HOME/Library/Caches/org.swift.swiftpm.
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages

      - name: Build iOS app (no codesign)
        script: |
          # Read the canonical version from pubspec.yaml so the Runner app
          # and the keyboard extension agree on CFBundleVersion.
          #
          # WHY THIS MATTERS:
          #   iOS REFUSES TO LOAD an app extension whose CFBundleVersion
          #   doesn't match its parent app's. Previously this step passed
          #   --build-number="${CM_BUILD_NUMBER:-75}" with a hardcoded 75
          #   fallback, while the keyboard extension's Ruby setup script
          #   reads `pubspec_build` (currently 78 from `version: 2.9.4+78`).
          #   Result: Runner = 75, extension = 78 → iOS silently disables
          #   the keyboard so the user sees a stub (no AI panel, no emoji
          #   panel, no suggestion strip, no spacebar label, globe key skips
          #   to other keyboards instead of staying on Rewordium).
          #
          # Strategy: extract version from pubspec.yaml once, export it
          # into the environment so BOTH `flutter build` and any subsequent
          # tooling pick up the same value. Codemagic's CM_BUILD_NUMBER (if
          # set) still wins via the env-var precedence the Ruby script
          # already honors.
          PUBSPEC_VERSION_LINE=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          PUBSPEC_MARKETING="${PUBSPEC_VERSION_LINE%+*}"
          PUBSPEC_BUILD="${PUBSPEC_VERSION_LINE##*+}"

          FLUTTER_BUILD_NAME_VAL="${FCI_BUILD_NAME:-${PUBSPEC_MARKETING}}"
          FLUTTER_BUILD_NUMBER_VAL="${CM_BUILD_NUMBER:-${PUBSPEC_BUILD}}"

          echo "Build version: ${FLUTTER_BUILD_NAME_VAL}+${FLUTTER_BUILD_NUMBER_VAL}"

          # Single-stage build. `flutter build ios --release --no-codesign`
          # invokes Xcode with the right configuration and produces a fully
          # built Runner.app at build/ios/iphoneos/Runner.app with the
          # keyboard extension already embedded under PlugIns/ via the
          # `Embed Foundation Extensions` build phase wired by
          # setup_keyboard_target.rb.
          #
          # On Xcode 26 / iOS 26 SDK, flutter_tools added a strict
          # post-build validation that demands DEVELOPMENT_TEAM be set even
          # when --no-codesign is passed. The actual xcodebuild *inside*
          # flutter succeeds — only the trailing validation trips. We
          # tolerate that failure with `|| echo`; the artifacts are present.
          #
          # WHY WE DROPPED THE SECOND XCODEBUILD STAGE:
          #   The previous yaml ran an explicit `xcodebuild clean build`
          #   after the flutter step. `clean` wipes DerivedData and the
          #   follow-up build recompiles everything from scratch —
          #   Firebase + MLKit + KeyboardKit + Flutter framework — which
          #   added ~10 minutes per run on top of the 3–4 minute flutter
          #   build. Flutter's invocation already produces the same .app
          #   with --no-codesign honored, so the second pass was duplicate
          #   work. Saved every CI run by not doing it twice.
          #
          # Building for device (`-sdk iphoneos`) sidesteps the MLKit
          # arm64-simulator problem entirely — MLKit ships full
          # arm64-iphoneos slices, so OCR works on real iPhones and iPads.
          # Liquid Glass / iOS 26 SDK code paths are reachable on any iOS 26
          # device installed via Sideloadly.
          flutter build ios --release --no-codesign \
            --build-name="${FLUTTER_BUILD_NAME_VAL}" \
            --build-number="${FLUTTER_BUILD_NUMBER_VAL}" \
            || echo "(flutter post-build validation failed — Runner.app artifacts are present, continuing)"

          # Sanity: the .app must exist with the extension embedded under
          # PlugIns/. If either is missing the build is broken regardless
          # of flutter's exit code, so fail loudly here rather than ship
          # an IPA that won't load the keyboard.
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "ERROR: build/ios/iphoneos/Runner.app missing after flutter build"
            exit 1
          fi
          if [ ! -d build/ios/iphoneos/Runner.app/PlugIns/RewordiumKeyboard.appex ]; then
            echo "ERROR: RewordiumKeyboard.appex was not embedded into Runner.app/PlugIns/"
            exit 1
          fi
          echo "OK: Runner.app + RewordiumKeyboard.appex present"

      - name: Package unsigned IPA for Sideloadly
        script: |
          # Source the Runner.app from flutter's output path now that we no
          # longer run a second xcodebuild that wrote to build/ios/DerivedData.
          rm -rf Payload rewordium-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # The .appex is already nested inside Runner.app/PlugIns/ from the
          # Embed Foundation Extensions phase — nothing else to copy.
          zip -r -q rewordium-unsigned.ipa Payload

    artifacts:
      - rewordium-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
