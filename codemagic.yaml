workflows:
  ios_sideloadly:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      flutter: stable
      # Xcode 26.5 (Swift 6.3, iOS 26 SDK):
      #  • KeyboardKit 10.5+ binary compiled with Swift 6.2.4 — needs ≥6.2 compiler
      #  • Xcode 26.4 only has Swift 6.1.2 → "SDK not supported by the compiler"
      #  • FoundationModels + Liquid Glass APIs require iOS 26 SDK
      xcode: 26.5
      cocoapods: default

      vars:
        BUNDLE_ID: com.noxquill.rewordium
        KEYBOARD_BUNDLE_ID: com.noxquill.rewordium.keyboard
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

      groups:
        - ios_secrets

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods  # specs cache only, NOT resolved Pods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages
        - $HOME/.pub-cache
        # ios/Pods is intentionally NOT cached — stale resolved pods cause
        # version-conflict errors when new pods (e.g. MLKit language packs) are added.

    scripts:
      - name: Install dependencies
        script: |
          # Flutter's SPM integration rsyncs plugin sources into these dirs
          # during pub get — they must exist on a fresh checkout.
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages
          flutter pub get

      - name: Prepare .env for CI
        script: |
          cat > .env <<EOF
          GROQ_API_KEY=$GROQ_API_KEY
          EOF

      - name: Restore Firebase iOS config
        script: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          gs = os.environ.get("IOS_GOOGLESERVICE_INFO_PLIST_BASE64", "")
          if not gs:
              sys.stderr.write("Missing IOS_GOOGLESERVICE_INFO_PLIST_BASE64\n")
              sys.exit(1)

          pathlib.Path("ios/Runner").mkdir(parents=True, exist_ok=True)

          with open("ios/Runner/GoogleService-Info.plist", "wb") as f:
              f.write(base64.b64decode(gs))

          app_id = os.environ.get("IOS_FIREBASE_APP_ID_FILE_BASE64", "")

          if app_id:
              pathlib.Path("ios").mkdir(parents=True, exist_ok=True)

              with open("ios/firebase_app_id_file.json", "wb") as f:
                  f.write(base64.b64decode(app_id))
          PY

      - name: Set iOS bundle identifier
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" ios/Runner/Info.plist

      - name: Wire RewordiumKeyboard extension target
        script: |
          gem list xcodeproj -i >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          cd ios
          ruby scripts/setup_keyboard_target.rb

      - name: Resolve SwiftPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages

      - name: Strip MLKit from iOS plugin deps (sim only)
        script: |
          # Why this exists:
          #   GoogleMLKit, MLImage, MLKitCommon, MLKitVision don't ship
          #   arm64-simulator slices. We need arm64 sim for iOS 26 +
          #   Liquid Glass testing, so MLKit on sim is fundamentally
          #   incompatible. Instead of patching generated files after the
          #   fact (we tried; xcconfigs/embed scripts have too many edges),
          #   we strip the `google_mlkit_*` plugin entries from
          #   `.flutter-plugins-dependencies` here. Then:
          #     • `flutter build ios --no-pub` won't regenerate the file
          #     • `injectPlugins` reads the stripped file → emits a
          #       GeneratedPluginRegistrant.m without MLKit references
          #     • `flutter_install_all_ios_pods` reads the stripped file
          #       → never installs MLKit pods → linker has nothing to
          #       miss
          #     • Podfile's `has_mlkit_plugins` check self-skips the
          #       language-pack pods
          #   On-device builds use a different workflow and don't run
          #   this script, so OCR keeps working on real iPhones.
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('.flutter-plugins-dependencies')
          if not p.exists():
              print('[strip-mlkit] .flutter-plugins-dependencies not found, skipping')
              raise SystemExit(0)

          data = json.loads(p.read_text())
          removed = []
          plugins = data.get('plugins', {})

          for platform_key in ('ios', 'macos'):
              platform_plugins = plugins.get(platform_key) or []
              kept = []
              for plug in platform_plugins:
                  name = plug.get('name', '')
                  if name.startswith('google_mlkit_'):
                      removed.append(f'{platform_key}:{name}')
                  else:
                      kept.append(plug)
              plugins[platform_key] = kept

          # Also strip from the top-level `dependencyGraph` so other
          # tooling (e.g. injectPlugins on macOS) sees a consistent view.
          dep_graph = data.get('dependencyGraph') or []
          data['dependencyGraph'] = [
              entry for entry in dep_graph
              if not entry.get('name', '').startswith('google_mlkit_')
          ]

          p.write_text(json.dumps(data, indent=2))
          print(f'[strip-mlkit] Removed {len(removed)} MLKit plugin entries: {removed}')
          PY

      - name: Update CocoaPods repo (required for MLKit 9.x specs)
        script: |
          pod repo update

      - name: Build iOS Simulator App
        script: |
          # Inject build settings into Debug.xcconfig (simulator builds use Debug).
          # Pin app to arm64 simulator (exclude x86_64) so iOS 26
          # simulators run it — required for Liquid Glass (`.glassEffect()`
          # in RewordiumKeyboard) and any future FoundationModels usage.
          # Suppress StoreKit 1 deprecation warnings (in_app_purchase_storekit legacy ObjC).
          cat >> ios/Flutter/Debug.xcconfig <<'XCFG'
          EXCLUDED_ARCHS[sdk=iphonesimulator*] = x86_64
          GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS = NO
          XCFG
          # --no-pub is CRITICAL: a regular `flutter build ios` runs
          # `pub get` internally, which would regenerate
          # `.flutter-plugins-dependencies` and undo the MLKit-strip step
          # above. We already ran `flutter pub get` at the top of the
          # workflow, so deps are current.
          flutter build ios --simulator --no-pub \
            --build-name="${FCI_BUILD_NAME:-2.9.1}" \
            --build-number="${CM_BUILD_NUMBER:-75}"

      - name: Zip Simulator App
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner.zip Runner.app

    artifacts:
      - build/ios/iphonesimulator/Runner.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log