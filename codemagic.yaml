workflows:
  ios_sideloadly:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      flutter: stable
      # Xcode 26.x required:
      #  • KeyboardKit 10.5+ compiled with Swift 6.2 + uses FoundationModels (iOS 26)
      #  • Liquid Glass APIs require iOS 26 SDK
      #  • StoreKit 1 deprecation warnings are warnings, not errors
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: com.noxquill.rewordium
        KEYBOARD_BUNDLE_ID: com.noxquill.rewordium.keyboard
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

      groups:
        - ios_secrets

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods  # specs cache only, NOT resolved Pods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages
        - $HOME/.pub-cache
        # ios/Pods is intentionally NOT cached — stale resolved pods cause
        # version-conflict errors when new pods (e.g. MLKit language packs) are added.

    scripts:
      - name: Install dependencies
        script: |
          # Flutter's SPM integration rsyncs plugin sources into these dirs
          # during pub get — they must exist on a fresh checkout.
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages
          flutter pub get

      - name: Prepare .env for CI
        script: |
          cat > .env <<EOF
          GROQ_API_KEY=$GROQ_API_KEY
          EOF

      - name: Restore Firebase iOS config
        script: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          gs = os.environ.get("IOS_GOOGLESERVICE_INFO_PLIST_BASE64", "")
          if not gs:
              sys.stderr.write("Missing IOS_GOOGLESERVICE_INFO_PLIST_BASE64\n")
              sys.exit(1)

          pathlib.Path("ios/Runner").mkdir(parents=True, exist_ok=True)

          with open("ios/Runner/GoogleService-Info.plist", "wb") as f:
              f.write(base64.b64decode(gs))

          app_id = os.environ.get("IOS_FIREBASE_APP_ID_FILE_BASE64", "")

          if app_id:
              pathlib.Path("ios").mkdir(parents=True, exist_ok=True)

              with open("ios/firebase_app_id_file.json", "wb") as f:
                  f.write(base64.b64decode(app_id))
          PY

      - name: Set iOS bundle identifier
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" ios/Runner/Info.plist

      - name: Wire RewordiumKeyboard extension target
        script: |
          gem list xcodeproj -i >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          cd ios
          ruby scripts/setup_keyboard_target.rb

      - name: Resolve SwiftPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages

      - name: Update CocoaPods repo (required for MLKit 9.x specs)
        script: |
          pod repo update

      - name: Build iOS Simulator App
        script: |
          flutter build ios --simulator \
            --build-name="${FCI_BUILD_NAME:-2.9.1}" \
            --build-number="${CM_BUILD_NUMBER:-75}"

      - name: Zip Simulator App
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner.zip Runner.app

    artifacts:
      - build/ios/iphonesimulator/Runner.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log